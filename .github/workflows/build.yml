name: Build mod jar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unzip source and locate Gradle project
        id: locate
        run: |
          set -e
          mkdir -p _src
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z" -d _src
          done

          BUILD_FILE=$(find . -maxdepth 5 \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' | awk -F/ '{print NF" "$0}' | sort -n | head -1 | cut -d' ' -f2-)

          if [ -z "$BUILD_FILE" ]; then
            echo "No build.gradle found anywhere in the repo or zip"
            find . -not -path './.git/*' -maxdepth 3
            exit 1
          fi

          DIR=$(dirname "$BUILD_FILE")
          echo "Found Gradle project in: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: ${{ steps.locate.outputs.dir }}/build/libs/*.jar
